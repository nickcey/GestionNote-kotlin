# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Augmentation de la mémoire pour Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

# Configuration Kotlin
kotlin.code.style=official
android.useAndroidX=true
android.enableJetifier=true

# Stratégie de compilation : évite d'utiliser un daemon séparé pour contourner l'erreur de connexion
# Note: 'kotlin.compiler.execution.strategy' est souvent passé en ligne de commande ou via gradle.properties
kotlin.compiler.execution.strategy=in-process
# Désactive le daemon si possible
kotlin.daemon.jvmargs=-Xmx1024m -Djava.net.preferIPv4Stack=true
